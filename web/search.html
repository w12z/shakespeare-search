<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shakespeare Search</title>
<style>
  body { font-family: Georgia, serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: normal; }
  form { display: flex; gap: 8px; margin: 20px 0 8px; }
  input { flex: 1; font-size: 16px; padding: 8px 10px; }
  button { font-size: 16px; padding: 8px 18px; }
  .stat { color: #666; font-size: 13px; margin-bottom: 20px; }
  .hit { border-top: 1px solid #ddd; padding: 12px 0; }
  .hit a { color: #06c; text-decoration: none; font-size: 15px; }
  .hit a:hover { text-decoration: underline; }
  .hit p { margin: 6px 0; }
  .meta { color: #777; font-size: 12px; font-family: monospace; }
</style>
</head>
<body>
<h1>Shakespeare Search</h1>
<form id="f">
  <input id="q" type="search" placeholder="to be or not to be" autofocus>
  <button>Search</button>
</form>
<div class="stat" id="stat"></div>
<div id="out"></div>

<script>
const f = document.getElementById("f");
const q = document.getElementById("q");
const out = document.getElementById("out");
const stat = document.getElementById("stat");

f.addEventListener("submit", async e => {
  e.preventDefault();
  if (!q.value.trim()) return;
  stat.textContent = "searching...";
  out.textContent = "";
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q.value));
    const d = await r.json();
    stat.textContent = d.count + " hits for “" + d.query + "”";
    for (const h of d.hits) {
      const div = document.createElement("div");
      const a = document.createElement("a");
      const p = document.createElement("p");
      const m = document.createElement("div");
      div.className = "hit";
      a.href = h.url;
      a.textContent = h.title;
      p.textContent = h.text;
      m.className = "meta";
      m.textContent = "score " + h.score + " · near " + h.near + " · line " + h.line;
      div.append(a, p, m);
      out.append(div);
    }
    if (!d.hits.length) out.textContent = "no match";
  } catch (err) {
    stat.textContent = "request failed: " + err;
  }
});
</script>
</body>
</html>
